name: Publish to npm

on:
  push:
    branches: [main]

# `id-token: write` lets the job prove its GitHub identity to npm
# (trusted publishing). Harmless if you authenticate with NPM_TOKEN instead.
permissions:
  contents: read
  id-token: write

# One publish at a time; a new push never cancels an in-flight publish.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Smoke test (client module)
        run: node test/stats-cost-smoke.cjs
      - name: Manifest check
        run: node test/stats-cost-manifest-check.cjs

  publish:
    needs: test
    runs-on: ubuntu-latest
    # Must match the "Environment name" configured under npm →
    # Trusted publishing for this package. Add protection rules under
    # repo Settings → Environments to gate who can trigger it.
    environment:
      name: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Compare with the registry
        id: version
        run: |
          set -euo pipefail
          current="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"
          registry="$(npm view "$name" version 2>/dev/null || echo none)"
          {
            echo "current=$current"
            echo "registry=$registry"
          } >> "$GITHUB_OUTPUT"
          if [ "$current" = "$registry" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version $current is already on the registry — nothing to publish."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify pack contents
        if: steps.version.outputs.changed == 'true'
        run: npm pack --dry-run
      - name: Publish
        if: steps.version.outputs.changed == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # With the NPM_TOKEN secret set, that token authenticates.
          # Without it, npm uses the GitHub OIDC identity (trusted publishing).
          # --provenance attaches a GitHub attestation either way.
          npm publish --provenance